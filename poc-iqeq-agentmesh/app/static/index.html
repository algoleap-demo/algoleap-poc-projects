<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoleap &middot; IQ-EQ Unified Agent Mesh</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@600;700;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared_styles.css">
    <style>
        /* Contextual Visibility */
        #planning-view, #targeting-view { width: 100%; }
        .tab-bar { display: flex; border-bottom: 2px solid #F1F5F9; margin-bottom: 10px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-size: 11px; font-weight: 800; color: #94A3B8; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
    </style>
</head>
<body>

<div class="hdr">
    <div style="display:flex; align-items:center; gap:15px">
        <img src="/assets/Algoleap_logo.png" alt="Algoleap" style="height:28px">
        <div style="width:1px; height:20px; background:#E2E8F0"></div>
        <div style="font-family:var(--font-heading); font-size:16px; font-weight:700">Unified Agent Mesh Dashboard</div>
    </div>
    <div style="font-family:'JetBrains Mono'; font-size:9px; font-weight:700; color:var(--brand-primary); padding:4px 10px; border:1px solid #BBF7D0; background:#F0FDF4; border-radius:15px">ISO 42001 COMPLIANT</div>
</div>

<div class="view-bar">
    <div style="color:var(--text-dim)">ACTIVE MISSION: <span style="color:var(--text-main)" id="mission-status">IDLE</span></div>
    <div style="width:1px; height:15px; background:#E2E8F0; margin:0 10px"></div>
    <button id="btn-poc1" class="btn on" onclick="selectView(1)">TARGETING & TRIAGE (POC 1)</button>
    <button id="btn-poc2" class="btn locked" onclick="selectView(2)">ACCOUNT PLANNING (POC 2)</button>
    <div style="flex:1"></div>
    <button id="start-btn" class="start-btn" onclick="executeMission()">INITIATE FULL MISSION</button>
</div>

<main>
    <div class="canvas-container">
        <svg class="mesh" viewBox="0 0 1000 750">
            <defs>
                <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#E2E8F0" stroke-width="1.6"/></marker>
                <marker id="arr-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#22C55E" stroke-width="1.6"/></marker>
            </defs>

            <!-- Shared Agent Pool BG -->
            <rect x="250" y="100" width="700" height="600" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="10 5"/>
            <text x="600" y="125" font-size="9" font-weight="800" fill="#CBD5E1" text-anchor="middle">SHARED AGENT POOL</text>

            <!-- Orchestrator (Top) -->
            <g id="ag-orch" class="ag ag-on" transform="translate(100, 30)">
                <rect width="800" height="50" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="2"/>
                <text x="400" y="32" text-anchor="middle" font-weight="800" font-size="14" fill="#1D4ED8">Master Orchestration Agent (LangGraph)</text>
            </g>

            <!-- Agent Nodes -->
            <g id="ag-data" class="ag ag-on" transform="translate(300, 150)">
                <rect width="600" height="60" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
                <text x="300" y="35" text-anchor="middle" font-weight="700" font-size="12">Data Ingestion Agent</text>
            </g>

            <!-- POC 1 Pipeline -->
            <g id="ag-ml" class="ag ag-on" transform="translate(300, 250)">
                <rect width="280" height="80" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
                <text x="140" y="45" text-anchor="middle" font-weight="700" font-size="12">ML Propensity Layer</text>
            </g>
            <g id="ag-reason" class="ag ag-on" transform="translate(620, 250)">
                <rect width="280" height="80" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
                <text x="140" y="45" text-anchor="middle" font-weight="700" font-size="12">Reasoning Agent (LLM)</text>
            </g>

            <!-- POC 2 Pipeline (Vertical Expansion) -->
            <g id="ag-brief" class="ag" transform="translate(300, 370)">
                <rect width="280" height="80" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
                <text x="140" y="45" text-anchor="middle" font-weight="700" font-size="12">Account Briefing Agent</text>
            </g>
            <g id="ag-plan" class="ag" transform="translate(620, 370)">
                <rect width="280" height="80" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
                <text x="140" y="45" text-anchor="middle" font-weight="700" font-size="12">Call Plan Strategist</text>
            </g>

            <!-- Shared Validation & Format -->
            <g id="ag-valid" class="ag ag-on" transform="translate(300, 500)">
                <rect width="600" height="60" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
                <text x="300" y="35" text-anchor="middle" font-weight="700" font-size="12">Validation & Audit Agent</text>
            </g>
            <g id="ag-fmt" class="ag ag-on" transform="translate(300, 600)">
                <rect width="600" height="60" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
                <text x="300" y="35" text-anchor="middle" font-weight="700" font-size="12">Payload Formatting Agent</text>
            </g>

            <!-- Return Loop -->
            <path d="M300 630 H260 V55 H300" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/>
        </svg>
    </div>

    <div class="data-pane">
        <div class="tab-bar">
            <div class="tab active" data-target="logs" onclick="switchPane('logs')">AGENT LOGS</div>
            <div class="tab" data-target="results" id="res-tab" onclick="switchPane('results')">MISSION OUTPUT</div>
        </div>
        
        <div id="logs" class="pane-content active"></div>
        
        <div id="results" class="pane-content">
            <div id="targeting-view"></div>
            <div id="planning-view" style="display:none"></div>
        </div>
    </div>
</main>

<div id="workbench-tray">
    <div style="background:#1e293b; padding:20px; color:#FFF">
        <div style="font-size:10px; font-weight:800; opacity:0.6; margin-bottom:5px">GOVERNANCE WORKBENCH</div>
        <div style="font-family:var(--font-heading); font-size:18px; font-weight:700">Audit & Conflict Resolution</div>
    </div>
    <div id="workbench-content" style="padding:20px; flex:1; overflow-y:auto"></div>
    <button style="margin:20px; padding:12px; border:none; border-radius:8px; cursor:pointer; font-weight:700" onclick="closeWorkbench()">DISMISS</button>
</div>

<script>
    let missionData = { targeting: [], planning: [] };
    let currentView = 1;
    let phase1Done = false;

    function switchPane(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pane-content').forEach(p => p.classList.remove('active'));
        document.querySelector(`.tab[data-target="${id}"]`).classList.add('active');
        document.getElementById(id).classList.add('active');
    }

    function renderTargeting(data) {
        const container = document.getElementById('targeting-view');
        container.innerHTML = `<h3 style="margin-bottom:15px; font-family:var(--font-heading)">Targeting Results (POC 1)</h3>`;
        
        data.accounts.forEach(acc => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px">
                    <div style="font-weight:800; color:var(--brand-blue)">${acc.account_id}</div>
                    <div style="font-size:10px; font-weight:800; background:#F1F5F9; padding:2px 8px; border-radius:10px">BUCKET ${acc.priority_bucket}</div>
                </div>
                <div style="font-weight:700; margin-bottom:4px">${acc.account_name}</div>
                <div style="font-size:12px; color:var(--text-dim); margin-bottom:12px">${acc.contact_person}</div>
                <div style="display:flex; gap:10px">
                    <div style="flex:1; font-size:10px">
                        <div style="opacity:0.6">Propensity</div>
                        <div style="font-weight:700">${(acc.ml_score * 100).toFixed(1)}%</div>
                    </div>
                    <div style="flex:1; font-size:10px">
                        <div style="opacity:0.6">Confidence</div>
                        <div style="font-weight:700">${(acc.confidence_level * 100).toFixed(1)}%</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderPlanning(data) {
        const container = document.getElementById('planning-view');
        container.innerHTML = `<h3 style="margin-bottom:15px; font-family:var(--font-heading)">Strategic Planning (POC 2)</h3>`;
        
        const rows = data.results || data.accounts || [];
        rows.forEach(res => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px">
                    <div style="font-weight:800; color:var(--brand-primary)">${res.account_id}</div>
                    ${res.conflict_flag ? '<div style="font-size:9px; font-weight:800; color:#EF4444; background:#FEF2F2; padding:2px 8px; border-radius:10px">CONFLICT DETECTED</div>' : ''}
                </div>
                <div style="font-weight:700; margin-bottom:2px">${res.account_name}</div>
                <div style="font-size:11px; color:var(--text-dim); margin-bottom:15px">${res.contact_person}</div>
                
                <details style="font-size:12px; cursor:pointer">
                    <summary style="font-weight:700; color:var(--brand-primary)">View Strategic Brief</summary>
                    <div style="padding:15px 0; line-height:1.6; border-top:1px solid #F1F5F9; margin-top:10px">${(res.brief_markdown || res.brief_text || '').replace(/\n/g, '<br>')}</div>
                </details>
                
                <details style="font-size:12px; cursor:pointer; margin-top:10px">
                    <summary style="font-weight:700; color:var(--brand-blue)">View Tactical Call Plan</summary>
                    <div style="padding:15px 0; line-height:1.6; border-top:1px solid #F1F5F9; margin-top:10px">${(res.call_plan_markdown || res.call_plan_text || '').replace(/\n/g, '<br>')}</div>
                </details>
            `;
            container.appendChild(card);
        });
    }

    function selectView(v) {
        if(v === 2 && !phase1Done) return;
        currentView = v;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('on'));
        document.getElementById(`btn-poc${v}`).classList.add('on');
        
        const activeAgents = v === 1 
            ? ['ag-orch', 'ag-data', 'ag-ml', 'ag-reason', 'ag-valid', 'ag-fmt']
            : ['ag-orch', 'ag-data', 'ag-brief', 'ag-plan', 'ag-valid', 'ag-fmt'];
        
        document.querySelectorAll('.ag').forEach(el => {
            if(activeAgents.includes(el.id)) el.classList.add('ag-on');
            else el.classList.remove('ag-on');
        });

        document.getElementById('targeting-view').style.display = v === 1 ? 'block' : 'none';
        document.getElementById('planning-view').style.display = v === 2 ? 'block' : 'none';
    }

    function addLog(l) {
        const item = document.createElement('div');
        item.className = 'log-entry';
        const st = l.status === 'START' || l.status === 'started' || l.status === 'processing';
        const statusClass = st ? 'active' : 'done';
        item.innerHTML = `
            <div class="log-hdr">
                <div class="log-status ${statusClass}"></div>
                <div class="log-agent">${l.agent_name.toUpperCase()}</div>
                <div style="margin-left:auto; font-size:9px; color:#94A3B8">${new Date().toLocaleTimeString()}</div>
            </div>
            <div class="log-msg">${l.message}</div>
        `;
        document.getElementById('logs').appendChild(item);
        document.getElementById('logs').scrollTop = document.getElementById('logs').scrollHeight;

        const el = document.getElementById(l.agent_name);
        if(el) {
            if(st) el.classList.add('ag-active');
            else { el.classList.remove('ag-active'); el.classList.add('ag-completed'); }
        }
        if(l.agent_name === 'ag-orch') document.getElementById('mission-status').innerText = l.message.toUpperCase();
    }

    async function executeMission() {
        document.querySelectorAll('.ag').forEach(el => el.classList.remove('ag-active', 'ag-completed'));
        document.getElementById('logs').innerHTML = '';
        switchPane('logs');

        const es = new EventSource('/events');
        es.onmessage = async (e) => {
            const log = JSON.parse(e.data);
            addLog(log);
            
            // Only close and render when the MASTER orchestrator signals the FINAL end
            // Only close and render when the MASTER orchestrator signals the FINAL end
            if(log.agent_name === 'ag-orch' && log.message && log.message.includes('Unified Mission Lifecycle Complete')) {
                es.close();
                addLog({agent_name: 'ag-orch', status: 'INFO', message: 'Mission Complete. Retrieving intelligence payloads...'});
                
                try {
                    const resp = await fetch('/mission_results');
                    const data = await resp.json();
                    
                    missionData.targeting = data.targeting;
                    missionData.planning = data.planning;
                    
                    if(data.targeting) {
                        const tData = data.targeting.targeting_results || data.targeting;
                        if(tData && tData.accounts) renderTargeting(tData);
                    }
                    if(data.planning) {
                        const pData = data.planning.planning_results || data.planning;
                        if(pData && (pData.results || pData.accounts)) renderPlanning(pData);
                    }
                    
                    phase1Done = true;
                    document.getElementById('btn-poc2').classList.remove('locked');
                    
                    setTimeout(() => {
                        switchPane('results');
                    }, 500);
                } catch(err) {
                    console.error("Failed to fetch final results:", err);
                }
            }
        };

        try {
            await fetch('/execute_mission', { method: 'POST' });
        } catch(err) { 
            console.error(err);
            es.close(); 
        }
    }

    function closeWorkbench() { document.getElementById('workbench-tray').style.display = 'none'; }

    // Initialize
    selectView(1);
</script>
</body>
</html>
