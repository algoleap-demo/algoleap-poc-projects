<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoleap &middot; IQ-EQ Unified Agent Mesh</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #3C8943;
            --brand-blue: #1D4ED8;
            --status-executing: #FACC15;
            --status-completed: #22C55E;
            --bg-light: #F9FAFB;
            --border-color: #E5E7EB;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: #111827; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .hdr { background: #FFFFFF; padding: 12px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); z-index: 20; }
        .hdr-l { display: flex; align-items: center; gap: 20px; }
        .logo { height: 32px; width: auto; }
        .hdr-t { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700; color: #111827; }

        .view-bar { background: #fff; border-bottom: 1px solid var(--border-color); padding: 10px 40px; display: flex; align-items: center; gap: 15px; z-index: 10; }
        .run-btn { background: var(--brand-blue); color: #FFF; border: none; padding: 10px 24px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .run-btn:hover { background: #1E40AF; transform: translateY(-1px); }

        main { display: flex; flex: 1; overflow: hidden; }
        .canvas-container { flex: 1.2; padding: 20px; display: flex; justify-content: center; align-items: center; background: #F8F9FB; position: relative; }
        svg.mesh { width: 100%; height: auto; max-height: 95%; overflow: visible; }

        .data-pane { flex: 1; background: #FFF; border-left: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .tabs { display: flex; background: #FFF; border-bottom: 1px solid #F3F4F6; }
        .tab { flex: 1; text-align: center; padding: 16px 0; font-size: 11px; font-weight: 800; cursor: pointer; color: #9CA3AF; border-bottom: 2px solid transparent; text-transform: uppercase; }
        .tab.active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
        .pane-content { display: none; height: 100%; overflow-y: auto; padding: 20px; }
        .pane-content.active { display: flex; flex-direction: column; }

        /* Results Styling */
        .card { background: #FFF; border: 1.5px solid #F3F4F6; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; color: #FFF; margin-bottom: 12px; }
        .badge-A { background: var(--brand-primary); }
        .brief-box { background: #F8F9FB; padding: 16px; border-radius: 8px; font-size: 13px; line-height: 1.6; color: #374151; }

        /* Logs Styling */
        .trace-card { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #F3F4F6; }
        .trace-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .trace-status { width: 8px; height: 8px; border-radius: 50%; background: #D1D5DB; }
        .trace-status.active { background: var(--status-executing); }
        .trace-status.done { background: var(--status-completed); }
        .trace-agent { font-size: 11px; font-weight: 700; background: #F3F4F6; padding: 3px 8px; border-radius: 4px; }
        .trace-desc { font-size: 13px; color: #4B5563; }

        /* SVG Highlights */
        .ag { transition: 0.4s; filter: opacity(0.5); }
        .ag-active rect { fill: var(--status-executing) !important; filter: opacity(1); }
        .ag-completed rect { fill: var(--status-completed) !important; filter: opacity(1); }
    </style>
</head>
<body>

<div class="hdr">
    <div class="hdr-l"><div class="hdr-t">IQ-EQ Unified Agent Mesh</div></div>
    <div style="font-size: 10px; font-weight: 800; color: #9CA3AF;">LANGGRAPH ORCHESTRATION</div>
</div>

<div class="view-bar">
    <button class="run-btn" onclick="startMission()">START UNIFIED MISSION</button>
    <div id="mission-status" style="margin-left: 20px; font-size: 12px; font-weight: 700; color: var(--brand-blue);"></div>
</div>

<main>
    <div class="canvas-container">
        <!-- SVG Mesh placeholder -->
        <svg class="mesh" viewBox="0 0 1000 700">
            <g id="ag-orch" class="ag" transform="translate(100, 50)">
                <rect width="800" height="60" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="2"/>
                <text x="400" y="35" text-anchor="middle" font-weight="700">Orchestrator Node (LangGraph)</text>
            </g>
            <!-- Phase 1: Targeting -->
            <g id="ag-targeting" class="ag" transform="translate(100, 200)">
                <rect width="380" height="150" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="2"/>
                <text x="190" y="80" text-anchor="middle" font-weight="700">Module: Targeting & Triage</text>
            </g>
            <!-- Phase 2: Planning -->
            <g id="ag-planning" class="ag" transform="translate(520, 200)">
                <rect width="380" height="150" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="2"/>
                <text x="190" y="80" text-anchor="middle" font-weight="700">Module: Account Planning</text>
            </g>
        </svg>
    </div>
    <div class="data-pane">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('logs')">Mission Logs</div>
            <div class="tab" onclick="switchTab('results')">Targeting Results</div>
            <div class="tab" onclick="switchTab('briefs')">Planning Briefs</div>
        </div>
        <div id="logs" class="pane-content active"></div>
        <div id="results" class="pane-content"></div>
        <div id="briefs" class="pane-content"></div>
    </div>
</main>

<script>
    const logs = document.getElementById('logs'), results = document.getElementById('results'), briefs = document.getElementById('briefs');

    function switchTab(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pane-content').forEach(p => p.classList.remove('active'));
        document.querySelector(`.tab[onclick="switchTab('${id}')"]`).classList.add('active');
        document.getElementById(id).classList.add('active');
    }

    function addLog(l) {
        const c = document.createElement('div');
        c.className = 'trace-card';
        const statusClass = l.status === 'START' ? 'active' : (l.status === 'END' ? 'done' : '');
        c.innerHTML = `
            <div class="trace-hdr">
                <div class="trace-status ${statusClass}"></div>
                <div class="trace-agent">${l.agent_name.toUpperCase()}</div>
            </div>
            <div class="trace-desc">${l.message}</div>
        `;
        logs.appendChild(c);
        logs.scrollTop = logs.scrollHeight;
        
        // Update SVG
        const agentId = l.agent_name === 'ag-orch' ? 'ag-orch' : 
                        (l.agent_name.startsWith('ag-targeting') ? 'ag-targeting' : 'ag-planning');
        const el = document.getElementById(agentId);
        if(el) {
            if(l.status === 'START') el.classList.add('ag-active');
            if(l.status === 'END') { el.classList.remove('ag-active'); el.classList.add('ag-completed'); }
        }
    }

    async function startMission() {
        logs.innerHTML = ''; results.innerHTML = ''; briefs.innerHTML = '';
        document.querySelectorAll('.ag').forEach(el => el.classList.remove('ag-active', 'ag-completed'));
        
        const es = new EventSource('/events');
        es.onmessage = (e) => addLog(JSON.parse(e.data));

        try {
            const r = await fetch('/run-mission', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ segment: 'All' })
            });
            const d = await r.json();
            // In a real demo, we'd wait for completion signals via SSE
            document.getElementById('mission-status').innerText = "Mission Running: " + d.run_id;
        } catch(e) { 
            es.close(); 
        }
    }
</script>
</body>
</html>
